<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            background-color: white;
            
        }

        #login{
            background-color: aqua;
            width: 350px;
            max-width: 90%;
            text-align: center;
            padding-bottom: 0.85rem;
            padding-top: 0.85rem;
            border-radius: 0.25rem;
            
        }   

        form{
            display: inline-block; 
        }
        
    </style>
     <title>home</title>
</head>
<body>
    <div id="login">
    <h2>USER LOGIN</h2>
    {% if error %}
         <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p class="{{category}}">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
        <label>Username <input type="email" name="email" placeholder="Enter your registered Email here" autocomplete="email" required/></label><br><br>
        <label>Password <input type="password" name="password" required minlength="8" maxlength="12" placeholder="Enter password here" autocomplete="current-password"/></label><br><br>
        <button type="submit">Log in</button>

    </form>
        <p>Forgotten password</p>
        <p>Don't have an account?
        <a href="{{ url_for('register') }}"><button type="submit">Register</button></a>
        </p>
    </div> 
</body>
</html>
